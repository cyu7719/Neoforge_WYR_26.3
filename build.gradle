import javax.inject.Inject

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    validateAccessTransformers = true

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx4G'
            jvmArgument '-Xms2G'
            jvmArgument '-XX:+UseCompressedOops'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force 'org.ow2.asm:asm:9.9'
        force 'org.ow2.asm:asm-commons:9.9'
        force 'org.ow2.asm:asm-tree:9.9'
        force 'org.ow2.asm:asm-analysis:9.9'
        force 'org.ow2.asm:asm-util:9.9'
    }
}

dependencies {
    // NeoForge is provided by the ModDevGradle plugin.
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('gitPush', GitPushTask)

tasks.named('build') {
    finalizedBy 'gitPush'
}

abstract class GitPushTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void run() {
        execOperations.exec {
            commandLine 'git', 'add', '-A'
        }

        boolean hasStagedChanges = execOperations.exec {
            commandLine 'git', 'diff', '--cached', '--quiet'
            ignoreExitValue = true
        }.exitValue != 0

        if (hasStagedChanges) {
            execOperations.exec {
                commandLine 'git', 'commit', '-m',
                        "Auto-commit from gradlew build (${new Date().format('yyyy-MM-dd HH:mm')})"
            }
        }

        int pushExit = execOperations.exec {
            commandLine 'git', 'push'
            ignoreExitValue = true
        }.exitValue

        if (pushExit != 0) {
            logger.warn 'git push failed (auth or network?). Build itself is unaffected.'
        }
    }
}
