# This is a neoforge.mods.toml file. It contains the data relating to the loading mods.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="wouldyourather"
version="${mod_version}"
displayName="Would You Rather"
authors="Coba"
description='''A Would You Rather mod that will give you good and bad choices to choose from.'''

[[mixins]]
config="wouldyourather.mixins.json"

# Your dependencies are correct and remain here
[[dependencies.wouldyourather]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.wouldyourather]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"